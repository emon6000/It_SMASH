    <script>
      // apply saved theme before first paint (no flash)
      try {
        var t = localStorage.getItem('msmart_theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
